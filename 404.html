<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>页面不存在 · QuantDesktop</title>
<meta name="robots" content="noindex" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: linear-gradient(180deg, #0d1117, #05080c);
    color: #e6edf3; text-align: center; padding: 24px;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .code {
    font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    font-size: .8rem; letter-spacing: .18em; color: #58a6ff; margin-bottom: 16px;
  }
  h1 { font-size: 1.6rem; margin: 0 0 12px; letter-spacing: -.01em; }
  p { margin: 0 0 28px; color: #8b949e; max-width: 34em; }
  a.btn {
    display: inline-block; padding: 12px 22px; border-radius: 6px; text-decoration: none;
    background: #58a6ff; color: #06101d; font-weight: 600;
  }
  a.btn:hover { background: #7cb8ff; }
  a.plain { color: #58a6ff; }
</style>
</head>
<body>
  <div>
    <p class="code">404 / NOT FOUND</p>
    <h1>这个地址没有内容</h1>
    <p>你要找的页面不存在，或者链接已经失效。QuantDesktop 的官网在下面。</p>
    <a class="btn" href="/quant-desktop/">前往 QuantDesktop 官网</a>
    <p style="margin-top:28px;font-size:.85rem">
      也可以直接去 <a class="plain" href="https://github.com/Leaderxin/quant-desktop">GitHub 仓库</a>
      或 <a class="plain" href="https://github.com/Leaderxin/quant-desktop/releases/latest">下载最新版</a>。
    </p>
  </div>
</body>
</html>
